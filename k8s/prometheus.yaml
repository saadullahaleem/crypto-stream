# Prometheus scrapes nothing itself: the collector pushes all metrics to its OTLP receiver.
otlp:
  # Resource attributes that become labels. job and instance come from service.name and service.instance.id.
  promote_resource_attributes:
    - k8s.pod.name
    - k8s.container.name
    - k8s.namespace.name
storage:
  tsdb:
    # OTLP batches from different sources can arrive a little out of order.
    out_of_order_time_window: 30m
