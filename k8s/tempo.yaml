# Tempo 3 in single-binary mode: the distributor writes to the live store directly, with no Kafka.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
# The service graph (which service calls which) and span metrics (rate, errors, duration), computed from the
# traces and written to Prometheus. Grafana's service graph and "Service structure" views read them.
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
overrides:
  defaults:
    compaction:
      block_retention: 48h  # the same as Prometheus
    metrics_generator:
      processors: [service-graphs, span-metrics]
usage_report:
  reporting_enabled: false
