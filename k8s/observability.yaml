# OpenTelemetry Collector -> Tempo (traces) and Prometheus (metrics). Grafana reads both.
apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector }
---
# Read-only access: pod discovery (Prometheus receiver), kubelet stats, and the cluster state (k8s_cluster receiver).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: otel-collector }
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, events, replicationcontrollers, resourcequotas, services,
                persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats, nodes/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: otel-collector }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-collector }
subjects:
  - { kind: ServiceAccount, name: otel-collector, namespace: crypto }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata:
      labels: { app: otel-collector }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8888" }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:latest
          imagePullPolicy: IfNotPresent
          args: [--config=/conf/otel-collector.yaml]
          env:
            - name: K8S_NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: conf, mountPath: /conf }]
      volumes:
        - { name: conf, configMap: { name: otel-collector } }
---
apiVersion: v1
kind: Service
metadata: { name: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200 }
    - { name: otlp-grpc, port: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo }
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tempo } }
  template:
    metadata:
      labels: { app: tempo }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3200" }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:3.0.3
          imagePullPolicy: IfNotPresent
          args: [-target=all, -config.file=/conf/tempo.yaml]
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: conf, configMap: { name: tempo } }
        - { name: data, emptyDir: {} }  # ponytail: 2 days of traces, lost when the pod moves; use a PVC to keep them
---
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec:
  type: LoadBalancer
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus }
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/conf/prometheus.yaml
            - --web.enable-otlp-receiver
            - --storage.tsdb.retention.time=2d
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: conf, configMap: { name: prometheus } }
        - { name: data, emptyDir: {} }  # ponytail: 2 days of metrics, lost on restart; use a PVC to keep them
